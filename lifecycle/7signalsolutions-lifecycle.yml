status_page:
  url: https://7signal.com/status/
  embed: https://status-content.7signal.com
  title: 7SIGNAL System Status
  http_status: 200
  note: >-
    The status page is a first-party page at 7signal.com/status/ that iframes a status app on
    status-content.7signal.com. It is client-rendered, so there is no machine-readable component/incident
    feed at either URL — a monitoring agent cannot subscribe to it.
deprecation_policy:
  published: true
  form: >-
    Migration notes in the public API-Examples repository, plus `deprecated: true` flags carried on the
    affected operations in the OpenAPI itself. Both surfaces agree, which is rare.
  removal_commitment: >-
    "will be removed in a future release" — no date, no minimum notice period and no version at which
    removal happens. That is a deprecation NOTICE, not a deprecation POLICY with a clock.
  sunset_header: not implemented
  deprecation_header: not implemented
  rfc8594: false
  parity_caveat: >-
    On the topology migration 7SIGNAL states plainly that "exact parity cannot be guaranteed" between
    the deprecated endpoints and their replacements, and invites a ticket where fields are missing.
  deprecated_operation_count: 19
  deprecated_families:
  - family: KPIs
    prefix: /kpis
    count: 11
    replacement: /time-series/* (see migration/kpi-endpoints.md)
    replacement_complete: false
    note: >-
      Four of the eleven have NO replacement named — /kpis/agents, /kpis/agents/access-points,
      /kpis/agents/adapter-drivers and /kpis/agents/client-capabilities are all mapped to "TBD", and
      /kpis/sensors/dest-nw-band-loc/{targetId} is mapped to "No corresponding group-by dimension
      currently". A caller on those endpoints has been told to leave with nowhere to go.
    parameter_changes:
    - averaging -> timeBucket (1_MIN, 10_MIN, 1_HOUR, 1_DAY, 1_MONTH)
    - kpiCodes -> metrics (same code values)
    - aggregateFunctions is new and REQUIRED
    - timelimit is dropped; the series is capped at 120 records
  - family: Topologies
    prefix: /topologies
    count: 8
    replacement: /locations/*, /service-areas/*, /access-points/* (see migration/topology-endpoints.md)
    replacement_complete: true
