x-gaps-observed:
  description: Contract gaps observed but deliberately NOT patched — an overlay that invents responses would be
    fabrication. Recorded here so the gap is measurable rather than silently repaired.
  items:
  - 401 Unauthorized is declared on 0 of 215 operations, although it is the primary auth failure mode
  - 429 Too Many Requests is declared on 0 of 215 operations, although rate limiting is documented and enforced
  - The oauth2 scopes map is empty; only 3 operations name a scope (read)
  - No tags[] declaration at the document root, though all 215 operations carry tags (32 distinct)
  - 60 of 215 operations have a summary but no description
  - 'IncidentResponse.resolutionReason (alert-incidents/schema.json) carries `nullable: true` as a sibling of `allOf`
    with no `type` — the one hard lint error in the contract (Redocly nullable-type-sibling). It is 7SIGNAL''s defect
    in the fragment they serve, verified present in openapi/_original/, and is deliberately NOT patched here: an
    overlay that silently repairs a provider''s spec would hide the measurement.'
  - 47 media-type examples and 6 schema examples do not validate against their own schemas (Redocly no-invalid-media-type-examples
    / no-invalid-schema-examples) — e.g. common.Range.toAsDateString carries an example that does not match format
    date-time.
  - 3 operations reference an oauth2 scope (`read`) that the securityScheme's scopes map does not define (Redocly
    security-scopes-defined).
  - 1 operation declares no 4xx response at all (Redocly operation-4xx-response).
