summary: >-
  7SIGNAL publishes NO client library to any package registry. Searched npm (registry.npmjs.org search
  for "7signal": zero results), PyPI (7signal, sevensignal, py7signal: all 404), RubyGems (empty result
  set) and crates.io (zero crates). Their public GitHub organization holds six repositories and none of
  them is a distributable SDK: API-Examples is a collection of runnable Python scripts with a shared
  auth_utils.py helper and no packaging metadata, and the remaining four are forks of third-party
  Wi-Fi/proxy libraries (proxy-vole, radiotap-library, ManagedWifi, ManagedNativeWifi) plus a fork of
  Cisco Meraki's dashboard-api-python. Integration is therefore hand-rolled HTTP against the OpenAPI.
