note: '7SIGNAL ships BOTH a 215-operation REST gateway and a remote MCP server, so a crosswalk is in scope. It is
  deliberately EMPTY on the crosswalk[] axis: the MCP tools/list call returns an RFC 9728 OAuth challenge (401 invalid_token),
  7SIGNAL publishes no llms.txt and no tool reference page, and the marketing page names capabilities but no tool
  names. Binding a tool to an operationId here would mean inventing the tool name first, which this pipeline does
  not do. rest_only[] below is therefore the complete REST surface an authenticated introspection run would be matched
  against.'
