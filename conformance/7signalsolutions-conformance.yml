- id: rfc8414-authorization-server-metadata
  conforms: true
  detail: >-
    The MCP host publishes a complete OAuth 2.0 Authorization Server Metadata document at
    /.well-known/oauth-authorization-server (issuer, authorization/token/registration endpoints,
    grant and response types, auth methods, PKCE methods).
  evidence:
  - https://mcp-v2.7signal.com/.well-known/oauth-authorization-server
- id: rfc9728-protected-resource-metadata
  conforms: true
  detail: >-
    An anonymous MCP tools/list returns 401 with a WWW-Authenticate header carrying
    resource_metadata="https://mcp-v2.7signal.com/.well-known/oauth-protected-resource", and that
    document resolves with resource, authorization_servers, scopes_supported and bearer_methods_supported.
    This is a textbook implementation of the MCP authorization spec.
  evidence:
