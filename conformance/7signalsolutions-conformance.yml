conformance:
- id: oauth2
  conforms: true
  detail: >-
    RFC 6749 client-credentials grant on the REST gateway, and RFC 6749/OAuth 2.1 authorization-code
    with PKCE on the MCP server. The token endpoint accepts application/x-www-form-urlencoded with
    grant_type, client_id and client_secret and returns access_token / token_type / expires_in / scope.
  evidence:
  - https://api-v2.7signal.com/api/gateway-v2.json
  - https://github.com/7Signal/API-Examples/blob/develop/docs/01-authentication.md
- id: rfc6749-error-response
  conforms: true
  detail: >-
    The token endpoint returns the RFC 6749 section 5.2 error object with the standard code enum
    (invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type,
    invalid_scope) plus error_description and error_uri, and links the RFC from the response description.
  evidence:
  - https://api-v2.7signal.com/api/oauth2/methods.json
- id: rfc7636-pkce
  conforms: true
  detail: 'code_challenge_methods_supported: ["S256"] on the MCP authorization server.'
