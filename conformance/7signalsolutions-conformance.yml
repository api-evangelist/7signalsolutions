domain_standard_conformance:
  found: false
  market: enterprise wireless / network performance monitoring
  detail: >-
    REWARD-ONLY, and honestly empty. The contract declares no domain standard for its market. It carries
    no SCIM URN, no OData $metadata surface, no OpenTelemetry/OTLP or OpenMetrics export, no SNMP MIB or
    IPFIX/NetFlow contract, no TM Forum Open API shape, no CAMARA pattern, and no IEEE/Wi-Fi Alliance
    schema. Its vocabulary (KPI codes, dimension sets, experience score, Sapphire Eye, Mobile Eye,
    Eyeris) is entirely proprietary. Wireless experience monitoring has no widely adopted contract
    standard to conform to, so nothing is being penalised here — the slot is left empty rather than
    filled with an invented conformance.
  probed_for:
  - SCIM schema URNs
  - OData $metadata
  - OTLP / OpenMetrics / Prometheus exposition
  - RFC 9457 problem+json
  - TM Forum Open API resource shapes
