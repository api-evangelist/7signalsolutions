reversibility:
  grade: documented
  summary: >-
    Reversal paths exist for the alerting and binding surfaces and are documented in prose, but 7SIGNAL
    publishes NO time window for any of them. Under the 0.12.0 rule that is `documented` (0.4), not
    `verified` — and it is deliberately not upgraded, because inventing a window here is the one error
    that could cost a user real configuration.
  write_surface_operations: 62
  reversals:
  - action: Disable an alert rule
    operation: patch-alert-rule-enabled
    rest: PATCH /alerting/alert-rules/{id}/enabled
    reversal: the same operation with enabled=true
    window: none stated — the toggle is unbounded in time
    preserves: rule configuration and full incident history
    docs: https://github.com/7Signal/API-Examples/blob/develop/docs/16-alerting.md
    note: >-
      7SIGNAL states the distinction explicitly — "Toggling a rule off is not the same as deleting it.
      PATCH .../enabled keeps the configuration and the incident history, and stops evaluation. DELETE
      removes the rule permanently." Prefer the toggle over DELETE whenever the intent is reversible.
  - action: Resolve an alerting incident
    operation: resolve-alerting-incident
    rest: POST /alerting/incidents/{id}/resolve
    reversal: none — resolving is terminal; a second call returns 409 "already resolved"
    window: n/a
    docs: https://github.com/7Signal/API-Examples/blob/develop/docs/16-alerting.md
  - action: Unbind a wireless network from a service area
    operation: sensor-service-area-unbind-network
    rest: DELETE /service-areas/sensors/{serviceAreaId}/networks/{networkId}
    reversal: re-bind the network to the service area
    window: none stated
  - action: Unbind an access point from its managing sensor
    operation: PathAccessPointsSensor-delete-y7z8
    rest: DELETE /access-points/sensors/{accessPointId}
    reversal: not documented
    window: none stated
  - action: Stop automated testing on a sensor
    operation: post-eyes-sensor-automated-testing
    rest: POST /eyes/sensors/{sensorId}/automated-testing
    reversal: the same operation started again
    window: none stated
  irreversible:
  - operation: delete-alert-rule
    rest: DELETE /alerting/alert-rules/{id}
    note: permanent; use PATCH .../enabled when the intent is reversible
  - operation: apikeys-with-id-delete-k1l2
    rest: DELETE /apikeys/{apikeyId}
    note: permanent; the secret is never recoverable
  - operation: PathNetworkKeysSensor-delete-nk5s6
    rest: DELETE /network-keys/sensors/{networkKeyId}
    note: >-
      Reference-checked (409 while still bound), but once deleted the key material is gone — network key
      secrets are returned masked as ******** and the real value is NEVER returned by the API.
  destructive_write_hazard:
    operation_class: PUT
    detail: >-
      PUT is a FULL REPLACE, not a merge, on alert rules, sensor targets and network keys. Omitted
      optional fields silently fall back to defaults (pendingPeriodSeconds 300, missingDataPolicy
      ignore, enabled true), which reads to a user as settings being wiped. On network keys the hazard
      is worse: because the fetched secret is masked, GET-then-PUT writes the literal string ********
      as the credential. GET, edit the fields you mean to change, and PUT the complete object back.
    docs: https://github.com/7Signal/API-Examples/blob/develop/docs/16-alerting.md
