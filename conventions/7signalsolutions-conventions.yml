idempotency:
  coverage: none
  mechanism: none
  header: null
  scope: []
  retention: null
  evidence: >-
    No occurrence of "idempoten" anywhere in the 215-operation OpenAPI, in any of the 51 published spec
    fragments, or in the 22-chapter reference documentation. No Idempotency-Key header, no client-supplied
    request id, no dedupe window. The one replay-safety property 7SIGNAL does publish is a per-response
    correlation id (`requestId` in every error envelope, and Eyeris-Request-Id / Eyeris-Response-Id on
    the Eyeris analysis endpoints) — that is tracing, not replay protection.
  consequence: >-
    A retried POST (create an alert rule, create an access point, create an API key, request an
    on-demand test) will create a second resource. An agent must read back before retrying a write.
  writes_affected: 62
  safe_by_shape:
  - 'PUT (full replace) and PATCH on a known id are naturally idempotent by target'
  - 'DELETE on a known id is idempotent in effect (repeat yields 404)'
pagination:
  style: page-number
  request_params:
  - name: page
    note: 1-based on most list endpoints ("The first page is 1"), but the Meraki integration-config docs describe page as starting at 0. Read the parameter description on the specific operation.
  - name: perPage
    note: records per page; default 20 on integration configs, 30 in the developer guide's worked example
  - name: sortField
  - name: order
  response_fields:
    envelope: pagination
    fields:
    - perPage
    - page
    - total
    - pages
    results_key: results
  example: '{"pagination":{"perPage":20,"page":0,"total":4,"pages":1},"results":[...]}'
  special_case: >-
    Time-series endpoints paginate at the METRIC level, not the data-point level — requesting 10
    metrics with perPage 5 yields 2 pages, and the series inside each metric is never paginated. A
    single series is hard-capped at 120 data points; widen timeBucket or shorten the range instead.
