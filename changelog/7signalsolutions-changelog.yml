  - area: Alerting
    reference: https://github.com/7Signal/API-Examples/blob/develop/docs/16-alerting.md
    endpoints:
    - GET,POST /alerting/alert-rules
    - GET /alerting/alert-rules/summary
    - GET,PUT,DELETE /alerting/alert-rules/{id}
    - PATCH /alerting/alert-rules/{id}/enabled
    - GET /alerting/incidents
    - GET /alerting/incidents/summary
    - GET /alerting/incidents/by-rule
    - GET /alerting/incidents/{id}
    - POST /alerting/incidents/{id}/resolve
    highlights:
    - A rule is evaluated once per combination of the dimensions in its dimensionSet
    - Enum values on these endpoints are lowercase (avg, ignore, <)
  - area: Sensor Targets, Network Keys & Default Configurations
    reference: https://github.com/7Signal/API-Examples/blob/develop/docs/19-sensor-targets-and-network-keys.md
    endpoints:
    - GET,POST /targets/sensors
    - GET,PUT,DELETE /targets/sensors/{targetId}
    - GET,POST /network-keys/sensors
    - GET /network-keys/sensors/templates
    - GET,PUT,DELETE /network-keys/sensors/{networkKeyId}
    - GET /default-configurations/sensors
    - GET /default-configurations/sensors/{configurationId}
    highlights:
    - Network key secrets are returned masked as ******** and the real value is never returned
    - PUT is a full replace, so echoing a fetched key back writes the mask as the literal secret
    - Deletes are reference-checked; a key still bound to a network returns 409
