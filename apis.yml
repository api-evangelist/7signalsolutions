aid: 7signalsolutions
name: 7SIGNAL
description: 7SIGNAL is an enterprise wireless and wired network experience monitoring platform, headquartered
  in Independence, Ohio, that measures Wi-Fi and network performance from the client's point of view using
  vendor-agnostic Sapphire Eye hardware sensors and Mobile Eye software agents installed on endpoints.
  The 7SIGNAL Platform exposes a public REST API gateway at api-v2.7signal.com covering agents and sensors,
  locations, service areas, networks and access points, time-series KPIs, on-demand tests (ping, traceroute,
  iPerf3, speedtest, MOS, packet capture), RF scans, impact and experience scores, alert rules and incidents
  with email/webhook/ServiceNow delivery, and Eyeris AI analysis over Server-Sent Events. It also publishes
  a remote, OAuth-protected MCP server so Claude, ChatGPT and Copilot agents can query live Wi-Fi telemetry
  in natural language.
image: https://7signal.com/images/brand-assets/7signal-share.png
url: https://raw.githubusercontent.com/api-evangelist/7signalsolutions/refs/heads/main/apis.yml
