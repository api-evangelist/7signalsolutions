- name: 7SIGNAL Platform API (Gateway v2)
  description: The 7SIGNAL public REST API gateway. 215 operations across 32 tags covering authentication,
    users, roles, groups and organizations, API keys, Eyes (agents and sensors), locations, service areas,
    networks, access points, network keys, sensor targets and default configurations, time-series and
    KPI metrics, on-demand tests and packet capture, RF scans, impact metrics, agent incidents, alert
    rules and alert incidents, Meraki integration configs, audits and Eyeris AI analysis. OAuth 2.0 client-credentials
    authentication with 24-hour bearer tokens.
