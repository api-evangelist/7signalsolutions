- name: 7SIGNAL MCP Server
  description: Remote, OAuth-protected Model Context Protocol server that lets Claude, ChatGPT, Microsoft
    Copilot and other agents query 7SIGNAL Wi-Fi telemetry and Eyeris AI analysis in natural language.
    The endpoint advertises RFC 9728 protected-resource metadata and an RFC 8414 authorization server
    with PKCE (S256), dynamic client registration and refresh tokens. The tool list itself requires an
    authenticated session, so it was not enumerated in this pass.
