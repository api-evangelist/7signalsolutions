components:
  schemas:
    on-demand-tests.TcpUploadTestRequest:
      allOf:
      - $ref: '#/components/schemas/on-demand-tests.TcpTestRequest'
      - type: object
        properties:
          uploadMegabytes:
            type: string
            default: FOUR
            enum:
            - ONE
            - FOUR
            - TEN
            - HUNDRED
            - TWOHUNDRED
            - FIVEHUNDRED
            description: Upload payload size in megabytes
    on-demand-tests.SpeedtestServerCandidate:
      type: object
      properties:
        id:
          type: integer
        latency:
          type: number
          format: double
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        location:
          type: string
        country:
          type: string
    on-demand-tests.TraceRouteResultsEntry:
      type: object
      properties:
        hop:
          type: integer
          minimum: 1
          description: Hop number
        ipAddress:
          type: string
          description: IP address of the responding hop
        timeMilliseconds:
          type: array
          description: Round-trip times in milliseconds for each probe attempt
          items:
            type: integer
        ttl:
          type: array
          description: TTL values used for each probe attempt
          items:
            type: integer
    on-demand-tests.TcpResultsEntry:
      type: object
      properties:
        testNumber:
          type: number
          description: The test number.
        timeMilliseconds:
          type: integer
          format: int64
          description: Duration of the test in milliseconds
        throughputMbps:
          type: number
          description: The throughput achieved during the test in Mbps.
        qosCategory:
          type: number
          description: The QoS category for the test.
    on-demand-tests.IpAddressSettings:
      type: object
      required:
      - ipProtocol
      description: IP addressing configuration used during the test
      properties:
        ipProtocol:
          type: string
          default: IPV4
          enum:
          - IPV4
          - IPV6
        useDhcp:
          type: boolean
          default: true
          description: Whether DHCP should be used for IP assignment
        localIpv4Address:
          type: string
          example: 0.0.0.0
          description: Static IPv4 address (when DHCP is disabled)
        localNetworkMask:
          type: string
          example: 0.0.0.0
          description: IPv4 network mask (when DHCP is disabled)
        gatewayIpv4Address:
          type: string
          example: 0.0.0.0
          description: IPv4 gateway address (when DHCP is disabled)
        ipv6Mode:
          type: string
          default: Automatic
          enum:
          - Disabled
          - Automatic
          - Automatic with Stable Privacy
          - Automatic with Privacy Extensions (prefer public address)
          - Automatic with Privacy Extensions (prefer temporary address)
          - DHCPv6
          - Stateless DHCPv6
          - Manual
          description: IPv6 configuration mode
        localIpv6Address:
          type: string
          example: '::'
          description: Static IPv6 address
        localIpv6Prefix:
          type: string
          example: '::'
          description: IPv6 prefix
        gatewayIpv6Address:
          type: string
          example: '::'
          description: IPv6 gateway address
    on-demand-tests.TcpDownloadTestStatusResponse:
      allOf:
      - $ref: '#/components/schemas/on-demand-tests.OnDemandTestStatusBase'
      - type: object
        properties:
          results:
            $ref: '#/components/schemas/on-demand-tests.TcpDownloadTestResults'
    on-demand-tests.MosTestSender:
      type: object
      description: Sender configuration (no IP or port exposure)
      properties:
        packetSizeBytes:
          type: integer
          default: 188
          description: Packet size in bytes
        sendTimeSeconds:
          type: integer
          default: 30
          description: Total send time in seconds
        streamIntervalMilliseconds:
          type: integer
          default: 20
          description: Stream interval in milliseconds
        samplingIntervalSeconds:
          type: integer
          default: 5
          description: Sampling interval in seconds
    on-demand-tests.WebDownloadTestStatusResponse:
      allOf:
      - $ref: '#/components/schemas/on-demand-tests.OnDemandTestStatusBase'
      - type: object
        properties:
          results:
            $ref: '#/components/schemas/on-demand-tests.WebDownloadTestResults'
    on-demand-tests.HttpTestRequest:
      allOf:
      - $ref: '#/components/schemas/on-demand-tests.ActiveTestRequest'
      - type: object
        required:
        - testEndpoint
        properties:
          testEndpoint:
            $ref: '#/components/schemas/on-demand-tests.TestEndpointSettings'
          durationSeconds:
            type: integer
            default: 2
            description: Duration of the http download test in seconds
          testCount:
            type: integer
            default: 1
            description: Number of download tests to perform
          qosCategory:
            $ref: '#/components/schemas/on-demand-tests.QosCategoryInRequest'
          sonarDSCP:
            type: integer
            default: 0
            description: DSCP value for Sonar traffic
    on-demand-tests.PingGatewayTestRequest:
      allOf:
      - $ref: '#/components/schemas/on-demand-tests.ActiveTestRequest'
      - type: object
        properties:
          payloadSizeBytes:
            type: integer
            default: 32
            enum:
            - 32
            - 150
            - 1450
            - 9600
            - 64000
            description: Ping payload size in bytes
          intervalMilliseconds:
            type: integer
            default: 1000
            description: Interval between ping packets
          timeoutMilliseconds:
            type: integer
            default: 1000
            description: Timeout for each ping request
          testCount:
            type: integer
            default: 10
            description: Number of ping requests to send
          qosCategory:
            $ref: '#/components/schemas/on-demand-tests.QosCategoryInRequest'
    on-demand-tests.HttpDownloadTestStatusResponse:
      allOf:
      - $ref: '#/components/schemas/on-demand-tests.OnDemandTestStatusBase'
      - type: object
        properties:
          results:
            $ref: '#/components/schemas/on-demand-tests.HttpDownloadTestResults'
    on-demand-tests.UdpResultsEntry:
      type: object
      properties:
        testNumber:
          type: number
          description: The test number.
        packetLoss:
          type: integer
          description: Number of packets lost during the test
        timeMilliseconds:
          type: integer
          format: int64
          description: Duration of the test in milliseconds
        throughputMbps:
          type: number
          description: The throughput achieved during the test in Mbps.
        qosCategory:
          type: number
          description: The QoS category for the test.
    on-demand-tests.WebDownloadTestResults:
      allOf:
      - $ref: '#/components/schemas/on-demand-tests.NetworkAttachResultsBase'
      - type: object
        properties:
          sentPackets:
            type: integer
            format: int64
            description: Total number of packets sent during the test.
          receivedPackets:
            type: integer
            format: int64
            description: Total number of packets received during the test.
          sentPacketRetransmissionCount:
            type: integer
            format: int64
            description: Number of retransmitted packets on send.
          receivedPacketRetransmissionCount:
            type: integer
            format: int64
            description: Number of retransmitted packets on receive.
          averageFrameSize:
            type: integer
            description: Average frame size in bytes.
          minimumFrameSize:
            type: integer
            description: Minimum frame size in bytes.
          maximumFrameSize:
            type: integer
            description: Maximum frame size in bytes.
          webDownloadResults:
            type: array
            items:
