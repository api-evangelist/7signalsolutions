          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        requestId:
          type: string
    on-demand-tests.Iperf3TestRequest:
      allOf:
      - $ref: '#/components/schemas/on-demand-tests.ActiveTestRequest'
      - type: object
        required:
        - testEndpoint
        properties:
          testEndpoint:
            type: string
            description: Hostname or IP address of the iperf3 server
          testEndpointPort:
            type: integer
            example: 5201
            description: Port of the iperf3 server
          testIntervalSeconds:
            type: integer
            example: 1
            description: Interval between periodic bandwidth reports
          testConnectTimeoutMilliseconds:
            type: integer
            example: 2000
            description: Connection timeout in milliseconds
          targetBitRateBps:
            type: integer
            example: 1000
            description: Target bitrate in bits per second
          pacingTimerMicroseconds:
            type: integer
            example: 1000
            description: Pacing timer in microseconds
          fairQueueRateBps:
            type: integer
            example: 1
            description: Fair queue rate in bits per second
          sendTimeSeconds:
            type: integer
            example: 10
            description: Duration of the test in seconds
          sendBytes:
            type: integer
            example: 100
            description: Total bytes to send
          sendBlocks:
            type: integer
            example: 100
            description: Number of blocks to send
          bufferLengthBytes:
            type: integer
            example: 128000
            description: Length of the buffer in bytes
          windowSizeBytes:
            type: integer
            example: 1000
            description: TCP window size in bytes
          congestionControl:
            type: string
            example: reno
            description: TCP congestion control algorithm
          maxSegmentSizeBytes:
            type: integer
            description: Maximum TCP segment size in bytes
          ipTos:
            type: integer
            example: 0
            description: IP Type of Service (TOS). Mutually exclusive with dscp.
          dscp:
            type: string
            example: '10'
            description: Differentiated Services Code Point (DSCP). Mutually exclusive with ipTos.
          omitSeconds:
            type: integer
            example: 2
            description: Seconds to omit from the start of the test
          useUDP:
            type: boolean
            default: false
            description: Run the test using UDP instead of TCP
          reverseDirection:
            type: boolean
            default: false
            description: Reverse the direction of the test
          bidirectional:
            type: boolean
            default: false
            description: Run bidirectional test
          dontFragment:
            type: boolean
            default: false
            description: Set the IP don't-fragment flag
          noDelay:
            type: boolean
            default: false
            description: Disable Nagle's algorithm
          zeroCopy:
            type: boolean
            default: false
            description: Use zero-copy mode
