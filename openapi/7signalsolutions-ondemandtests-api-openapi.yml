  /on-demand-tests/sensors/{sensorId}/ping-gateway:
    post:
      summary: Trigger ping default gateway test
      operationId: on-demand-tests-ping-gateway
      description: Triggers a Ping default gateway test for a given sensor and returns a Test ID for fetching results later.
      security:
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/on-demand-tests.SensorIdFilterForRunTest'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/on-demand-tests.PingGatewayTestRequest'
            examples:
              ping-gateway-test:
                summary: Ping default gateway test (change accessPointId as needed)
                value:
                  testType: WLAN
                  accessPointId: 230959
                  maxAttachTimeoutMilliseconds: 20000
                  maxIpAddressWaitTimeMilliseconds: 60000
                  customMacAddress: 00:00:00:00:00:00
                  ipAddress:
                    ipProtocol: IPV4
                    useDhcp: true
                  payloadSizeBytes: '32'
                  intervalMilliseconds: 1000
                  timeoutMilliseconds: 1000
                  testCount: 10
                  qosCategory: BEST_EFFORT_0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/on-demand-tests.OnDemandTestResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
      tags:
      - OnDemandTests
  /on-demand-tests/sensors/{sensorId}/ping-gateway/{testId}:
    get:
