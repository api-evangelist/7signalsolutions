      properties:
        port:
          type: integer
          default: 0
          description: Inbound UDP port on sensor (advanced use only). Defaults to sensor default if omitted.
        windowSizeSeconds:
          type: integer
          default: 10
          description: Receiver window size in seconds
        samplingIntervalSeconds:
          type: integer
          default: 1
          description: Sampling interval in seconds
        dejitteringBufferMilliseconds:
          type: integer
          default: 120
          description: Dejitter buffer size in milliseconds
        timeoutSeconds:
          type: integer
          default: 30
