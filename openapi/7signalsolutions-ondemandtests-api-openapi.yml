          uploadMegabytes:
            type: string
            default: FOUR
            enum:
            - ONE
            - FOUR
            - TEN
            - HUNDRED
            - TWOHUNDRED
            - FIVEHUNDRED
            description: Upload payload size in megabytes
    on-demand-tests.PingResultsEntry:
      type: object
      properties:
        testNumber:
          type: number
          description: The test number.
        timeMilliseconds:
          type: number
          description: The time taken for the test in milliseconds.
        qosCategory:
          type: number
          description: The QoS category for the test.
    on-demand-tests.OnDemandTestStatusBase:
      type: object
      required:
      - testId
      - runStatus
      properties:
        testId:
          type: string
          description: The test ID which was used to trigger the test.
        runStatus:
          type: string
          description: The overall status of the test which was triggered earlier
          enum:
          - IN_PROGRESS
          - COMPLETE
          - ERROR
        errorMessage:
          type: string
          description: The error message if any that occurred during test.
        errorCode:
          type: string
          description: The error code if any that occurred during test.
        testStatus:
          type: string
          description: Additional indicator in case of test failures.
    on-demand-tests.HttpUploadTestStatusResponse:
      allOf:
      - $ref: '#/components/schemas/on-demand-tests.OnDemandTestStatusBase'
      - type: object
        properties:
          results:
            $ref: '#/components/schemas/on-demand-tests.HttpUploadTestResults'
    on-demand-tests.ActiveTestRequest:
      allOf:
      - $ref: '#/components/schemas/on-demand-tests.ActiveTestRequestBase'
      - type: object
        required:
        - ipAddress
        properties:
          ipAddress:
            $ref: '#/components/schemas/on-demand-tests.IpAddressSettings'
    common.ZeroBasedPagination:
      type: object
      properties:
        perPage:
          type: integer
          description: Number of records per page
        page:
          type: integer
          description: Current page number (0-based)
        total:
          type: integer
          description: Total number of records available
        pages:
          type: integer
          description: Total number of pages
    on-demand-tests.SpeedtestPing:
      type: object
      properties:
        latencyMilliseconds:
          type: number
          format: double
        latencyLowMilliseconds:
          type: number
          format: double
        latencyHighMilliseconds:
          type: number
          format: double
        jitterMilliseconds:
          type: number
          format: double
        elapsedMilliseconds:
          type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    on-demand-tests.PacketCaptureListResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/common.ZeroBasedPagination'
        items:
          type: array
          description: List of packet capture test metadata
          items:
            $ref: '#/components/schemas/on-demand-tests.PacketCaptureItem'
    on-demand-tests.SpeedtestResults:
      type: object
      properties:
        attribution:
          $ref: '#/components/schemas/on-demand-tests.SpeedtestAttribution'
        download:
          $ref: '#/components/schemas/on-demand-tests.SpeedtestTransfer'
        upload:
          $ref: '#/components/schemas/on-demand-tests.SpeedtestTransfer'
        ping:
          $ref: '#/components/schemas/on-demand-tests.SpeedtestPing'
        interface:
          $ref: '#/components/schemas/on-demand-tests.SpeedtestInterface'
        selectedServer:
          $ref: '#/components/schemas/on-demand-tests.SpeedtestServerCandidate'
        serverCandidates:
          type: array
          items:
            $ref: '#/components/schemas/on-demand-tests.SpeedtestServerCandidate'
    on-demand-tests.PingTestResults:
      allOf:
      - $ref: '#/components/schemas/on-demand-tests.NetworkAttachResultsBase'
      - type: object
        properties:
          pingResults:
            type: array
            items:
              $ref: '#/components/schemas/on-demand-tests.PingResultsEntry'
    on-demand-tests.UdpUploadTestStatusResponse:
      allOf:
      - $ref: '#/components/schemas/on-demand-tests.OnDemandTestStatusBase'
      - type: object
        properties:
          results:
            $ref: '#/components/schemas/on-demand-tests.UdpUploadTestResults'
    on-demand-tests.ActiveTestRequestBase:
      type: object
      required:
      - accessPointId
      - ipAddress
      properties:
        testType:
          type: string
          description: Network interface used for the test
          default: WLAN
          enum:
          - WLAN
          - Ethernet
        accessPointId:
          type: integer
          minimum: 1
          description: Access point ID on which the test is executed
        maxAttachTimeoutMilliseconds:
          type: integer
          default: 20000
          description: Maximum time to wait for network attach
        maxIpAddressWaitTimeMilliseconds:
          type: integer
          default: 60000
          description: Maximum time to wait for IP address assignment
        customMacAddress:
          type: string
          default: 00:00:00:00:00:00
          description: Optional custom MAC address
  parameters:
    on-demand-tests.SensorIdFilterForRunTest:
      name: sensorId
      in: path
      description: Trigger test for the sensor referenced by its id.
      required: true
      schema:
        type: integer
    on-demand-tests.TestIdFilter:
      name: testId
      in: path
      description: Get test status for the test referenced by its ID
      required: true
      schema:
        type: string
        format: uuid
    on-demand-tests.SensorIdFilter:
      name: sensorId
      in: path
      description: Get test status for the sensor referenced by its ID
      required: true
      schema:
        type: integer
  responses:
    common.403Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/common.ResponseStatusException'
    common.404NotFoundResponse:
      description: Resource Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/common.ResponseStatusException'
    common.400BadRequestResponse:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/common.ResponseStatusException'
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes: {}
