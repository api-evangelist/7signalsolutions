                  maxIpAddressWaitTimeMilliseconds: 60000
                  customMacAddress: 00:00:00:00:00:00
                  ipAddress:
                    ipProtocol: IPV4
                    useDhcp: true
                  testEndpoint:
                    sonarId: 2147481002
                    resolveDNSOnSensor: true
                  minimumTtl: 1
                  maximumTtl: 255
                  queriesPerHop: 5
                  timeoutMilliseconds: 2000
                  testTimeoutSeconds: 20
                  qosCategory: BEST_EFFORT_0
