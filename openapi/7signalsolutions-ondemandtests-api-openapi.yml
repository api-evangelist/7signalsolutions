openapi: 3.2.0
info:
  title: 7SIGNAL On Demand Tests API
  description: This is the 7SIGNAL public API for interacting with the 7SIGNAL Platform
  version: 2.21.1
  contact:
    email: info@7signal.com
  license:
    name: All Rights Reserved
    url: https://www.7signal.com/contact
servers:
- url: https://api-v2.7signal.com
  description: 7SIGNAL API Gateway (production)
tags:
- name: OnDemandTests
paths:
  /on-demand-tests/sensors/active-tests:
    get:
      summary: List active on-demand tests
      operationId: on-demand-tests-active-tests-list
      description: Retrieve a paginated list of active on-demand test metadata with filtering options
      security:
      - oauth2: []
      parameters:
      - name: sensorId
        in: query
        required: true
        description: Filter by sensor ID
        schema:
          type: integer
          format: int64
      - name: testType
        in: query
        required: true
        description: Filter by test type
        schema:
          type: string
          enum:
          - PING
          - HTTP_DOWNLOAD
          - HTTP_UPLOAD
          - IPERF3
          - SPEEDTEST
          - TRACEROUTE
          - MOS
          - UDP_DOWNLOAD
          - UDP_UPLOAD
          - TCP_DOWNLOAD
          - TCP_UPLOAD
          - WEB_DOWNLOAD
      - name: channel
        in: query
        required: false
        description: Filter by WiFi channel number
        schema:
          type: integer
      - name: apId
        in: query
        required: false
        description: Filter by access point ID
        schema:
          type: integer
      - name: band
        in: query
        required: false
        description: Filter by frequency band (2.4, 5, or 6 GHz)
        schema:
          type: string
          enum:
          - '2.4'
          - '5'
          - '6'
          - all
      - name: start
        in: query
        required: false
        description: Start time for filtering (epoch milliseconds)
        schema:
          type: integer
          format: int64
      - name: end
        in: query
        required: false
        description: End time for filtering (epoch milliseconds)
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        description: Page number (zero-based)
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        required: false
        description: Page size
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/on-demand-tests.ActiveTestsListResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
      tags:
      - OnDemandTests
  /on-demand-tests/sensors/packet-capture:
    get:
      summary: List packet capture tests
      operationId: on-demand-tests-pcap-list
      description: Retrieve a paginated list of packet capture test metadata with filtering options
      security:
      - oauth2: []
      parameters:
      - name: sensorId
        in: query
        required: false
        description: Filter by sensor (eye) ID
        schema:
          type: integer
          format: int64
      - name: channel
        in: query
        required: false
        description: Filter by channel number
        schema:
          type: integer
      - name: apId
        in: query
        required: false
        description: Filter by access point ID
        schema:
          type: integer
      - name: band
        in: query
        required: false
        description: Filter by frequency band (2.4, 5, or 6 GHz)
        schema:
          type: string
          enum:
          - '2.4'
          - '5'
          - '6'
          - all
      - name: start
        in: query
        required: false
        description: Start time for filtering (epoch milliseconds)
        schema:
          type: integer
          format: int64
      - name: end
        in: query
        required: false
        description: End time for filtering (epoch milliseconds)
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        description: Page number (zero-based)
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        required: false
        description: Page size
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/on-demand-tests.PacketCaptureListResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
      tags:
      - OnDemandTests
  /on-demand-tests/sensors/{sensorId}/packet-capture:
    post:
      summary: Trigger packet capture test
      operationId: on-demand-tests-pcap
      description: Triggers a Packet Capture test for a given sensor and returns a Test ID for fetching results later. The capture duration must be 3600 seconds or less.
      security:
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/on-demand-tests.SensorIdFilterForRunTest'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/on-demand-tests.PacketCaptureTestRequest'
            examples:
              packet-capture-channel-mode:
                summary: Channel Mode
                value:
                  mode: CHANNEL
                  accessPointId: 5
                  captureTimeSeconds: 10
                  captureFilter: ''
                  band: 5
                  channel: 36
              packet-capture-access-point-mode:
                summary: Access Point Mode
                value:
                  mode: ACCESS_POINT
                  accessPointId: 123
                  captureTimeSeconds: 10
                  captureFilter: ''
                  band: 2.4
                  channel: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/on-demand-tests.OnDemandTestResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
      tags:
      - OnDemandTests
  /on-demand-tests/sensors/{sensorId}/packet-capture/{testId}:
    get:
      summary: Get packet capture status
      operationId: on-demand-tests-pcap-status
      description: Get packet capture status for the specified sensor and test ID
      security:
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/on-demand-tests.SensorIdFilter'
      - $ref: '#/components/parameters/on-demand-tests.TestIdFilter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/on-demand-tests.PacketCaptureTestStatusResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
      tags:
      - OnDemandTests
  /on-demand-tests/sensors/{sensorId}/packet-capture/{testId}/download:
    get:
      summary: Get packet capture file
      operationId: on-demand-tests-pcap-file
      description: Get packet capture file for the specified sensor and test ID
      security:
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/on-demand-tests.SensorIdFilter'
      - $ref: '#/components/parameters/on-demand-tests.TestIdFilter'
      responses:
        '200':
          description: pcap file returned
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/vnd.tcpdump.pcap:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
        '403':
          $ref: '#/components/responses/common.403Forbidden'
      tags:
      - OnDemandTests
  /on-demand-tests/sensors/{sensorId}/ping:
    post:
      summary: Trigger ping test
      operationId: on-demand-tests-ping
      description: Triggers a Ping test for a given sensor and returns a Test ID for fetching results later.
      security:
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/on-demand-tests.SensorIdFilterForRunTest'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/on-demand-tests.PingTestRequest'
            examples:
              ping-test-with-sonar:
                summary: Ping test using Sonar endpoint (change accessPointId and sonarId as needed)
                value:
                  testType: WLAN
                  accessPointId: 101
                  maxAttachTimeoutMilliseconds: 20000
                  maxIpAddressWaitTimeMilliseconds: 60000
                  customMacAddress: null
                  testEndpoint:
                    testHost: null
                    sonarId: 1001
                    resolveDNSOnSensor: true
                    pingEndpointId: null
                  ipAddress:
                    ipProtocol: IPV4
                    useDhcp: true
                  payloadSizeBytes: 32
                  intervalMilliseconds: 1000
                  timeoutMilliseconds: 1000
                  testCount: 10
                  qosCategory: 0
              ping-test-with-test-host:
                summary: Ping test using explicit test host (change accessPointId and testHost as needed)
                value:
                  testType: WLAN
                  accessPointId: 102
                  testEndpoint:
                    testHost: 8.8.8.8
                    sonarId: null
                    resolveDNSOnSensor: false
                    pingEndpointId: null
                  ipAddress:
                    ipProtocol: IPV4
                    useDhcp: true
                  payloadSizeBytes: 32
                  intervalMilliseconds: 1000
                  timeoutMilliseconds: 1000
                  testCount: 10
                  qosCategory: 0
              ping-test-with-ping-endpoint:
                summary: Ping test using predefined ping endpoint (change accessPointId and pingEndpointId as needed)
                value:
                  testType: WLAN
                  accessPointId: 103
                  testEndpoint:
                    testHost: null
                    sonarId: null
                    resolveDNSOnSensor: true
                    pingEndpointId: 55
                  ipAddress:
                    ipProtocol: IPV4
                    useDhcp: true
                  payloadSizeBytes: 150
                  intervalMilliseconds: 1000
                  timeoutMilliseconds: 1000
                  testCount: 10
                  qosCategory: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/on-demand-tests.OnDemandTestResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
      tags:
      - OnDemandTests
  /on-demand-tests/sensors/{sensorId}/ping/{testId}:
    get:
      summary: Get ping status
      operationId: on-demand-tests-ping-status
      description: Get ping status for the specified sensor and test ID
