openapi: 3.2.0
info:
  title: 7SIGNAL Locations API
  description: This is the 7SIGNAL public API for interacting with the 7SIGNAL Platform
  version: 2.21.1
  contact:
    email: info@7signal.com
  license:
    name: All Rights Reserved
    url: https://www.7signal.com/contact
servers:
- url: https://api-v2.7signal.com
  description: 7SIGNAL API Gateway (production)
tags:
- name: Locations
paths:
  /locations/agents:
    get:
      summary: List the Agent Locations
      operationId: agent-locations-get
      description: Page through all of the Agent Locations
      security:
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/common.OrganizationRequestParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/locations.GetAgentLocationsResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
      tags:
      - Locations
    post:
      summary: Creates an Agent Location
      operationId: agent-locations-post
      parameters:
      - $ref: '#/components/parameters/common.OrganizationRequestParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/locations.AgentLocationRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/locations.AgentLocationResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
      security:
      - oauth2: []
      tags:
      - Locations
  /locations/agents/{locationId}:
    get:
      summary: Fetch the specified Agent Location
      operationId: agent-location-get
      security:
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/common.OrganizationRequestParam'
      - name: locationId
        in: path
        description: Fetch the specific Location referenced by its id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/locations.GetAgentLocationResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
      tags:
      - Locations
    put:
      summary: Replace the specified Agent Location with the details in the payload
      operationId: agent-location-put
      parameters:
      - $ref: '#/components/parameters/common.OrganizationRequestParam'
      - name: locationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/locations.AgentLocationRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/locations.AgentLocationResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
      security:
      - oauth2: []
      tags:
      - Locations
    delete:
      summary: Delete the Agent Location specified by the UUID
      operationId: agent-location-delete
      parameters:
      - $ref: '#/components/parameters/common.OrganizationRequestParam'
      - name: locationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
      security:
      - oauth2: []
      tags:
      - Locations
  /locations/sensors:
    get:
      summary: List the Sensor Locations
      operationId: sensor-locations-get
      description: Page through all of the Sensor Locations
      security:
      - oauth2: []
      parameters:
      - name: locationId
        in: query
        description: Filter the specific location by its parent location id
        required: false
        schema:
          type: number
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/locations.GetSensorLocationsResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
      tags:
      - Locations
    post:
      summary: Creates Sensor Locations
      operationId: sensor-locations-post
      description: 'Returns the new locations, required fields: name, and exactly one of parentOrganizationId/parentLocationId. The timeZone field accepts a timezone value like "UTC", "EST", or "GMT", or "INHERIT"/omit to leave it unset - "INHERIT" only resolves to a real ancestor''s timezone when created with parentLocationId; under parentOrganizationId there''s no parent Location to inherit from, so it falls back to the default timezone instead. The countryCode field accepts a CountryCode value - either its ISO 3166-1 alpha-2 code (e.g. "US") or its constant name (e.g. "UNITED_STATES"), case-insensitive'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/locations.PostSensorLocationsRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/locations.GetSensorLocationsResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
      security:
      - oauth2: []
      tags:
      - Locations
    put:
      summary: Updates Sensor Locations
      operationId: sensor-locations-put
      description: 'Returns the updated locations, required fields: name. The timeZone field accepts a timezone value like "UTC", "EST", or "GMT", or "INHERIT"/omit to leave it unset - "INHERIT" only resolves to a real ancestor''s timezone when created with parentLocationId; a top-level location under an Organization has no parent Location to inherit from, so it falls back to the default timezone instead. The countryCode field accepts a CountryCode value - either its ISO 3166-1 alpha-2 code (e.g. "US") or its enum constant name (e.g. "UNITED_STATES"), case-insensitive'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/locations.PutSensorLocationsRequest'
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/locations.GetSensorLocationsResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
      security:
      - oauth2: []
      tags:
      - Locations
    delete:
      summary: Deletes Sensor Locations
      operationId: sensor-locations-delete
      parameters:
      - $ref: '#/components/parameters/locations.DeleteSensorLocationIds'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
      security:
      - oauth2: []
      tags:
      - Locations
  /locations/sensors/{locationId}:
    get:
      summary: Fetch the specified Sensor Location
      operationId: sensor-location
      security:
      - oauth2: []
      parameters:
      - name: locationId
        in: path
        description: Fetch the specific location by its id
        required: true
        schema:
          type: number
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/locations.GetSensorLocationResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
      tags:
      - Locations
    put:
      summary: Update the specified Sensor Location
      operationId: sensor-location-put
      description: 'Returns the updated location, required fields: name. The timeZone field accepts a timezone value like "UTC", "EST", or "GMT", or "INHERIT"/omit to leave it unset - "INHERIT" only resolves to a real ancestor''s timezone when created with parentLocationId; a top-level location under an Organization has no parent Location to inherit from, so it falls back to the default timezone instead. The countryCode field accepts a CountryCode value - either its ISO 3166-1 alpha-2 code (e.g. "US") or its enum constant name (e.g. "UNITED_STATES"), case-insensitive'
      security:
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/locations.SensorLocationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/locations.SensorSingleUpdateLocationRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/locations.GetSensorLocationResponse'
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
        '404':
          $ref: '#/components/responses/common.404NotFoundResponse'
      tags:
      - Locations
    delete:
      summary: Delete the specified Sensor Location
      operationId: sensor-location-delete
      parameters:
      - $ref: '#/components/parameters/locations.SensorLocationId'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/common.400BadRequestResponse'
      security:
      - oauth2: []
      tags:
      - Locations
