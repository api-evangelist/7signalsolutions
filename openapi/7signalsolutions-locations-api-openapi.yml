    locations.GetAgentLocationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        organization:
          type: string
        parent:
          type: string
          format: uuid
        children:
          type: array
          items:
            $ref: '#/components/schemas/locations.AgentLocationResponse'
        serviceAreas:
          type: array
          items:
            $ref: '#/components/schemas/service-areas.AgentServiceArea'
    locations.SensorCreateLocationRequest:
      type: object
      properties:
        name:
          type: string
        locationType:
          type: string
          enum:
          - UNDEFINED
          - REGION
          - COUNTRY
          - STATE
          - CITY
          - DISTRICT
          - BUILDING
        parentOrganizationId:
          type: number
          example: '123'
          description: The parent Organization's id, to create this as a top-level location under an Organization - exactly one of parentOrganizationId/parentLocationId must be provided
        parentLocationId:
          type: number
          example: '42'
          description: The parent Location's id, to create this as a sub-location under another Location instead - exactly one of parentOrganizationId/parentLocationId must be provided
        timeZone:
          description: A java.util.TimeZone id, or "INHERIT"/omit to leave it unset. "INHERIT" only resolves to a real ancestor's timezone when created with parentLocationId - under parentOrganizationId there's no parent Location to inherit from, so it falls back to the Carat server's own default timezone instead
          example: America/New_York
          oneOf:
          - $ref: '#/components/schemas/locations.TimeZoneId'
          - type: string
            enum:
            - INHERIT
        countryCode:
          $ref: '#/components/schemas/locations.CountryCodeName'
    locations.AgentLocationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        organization:
          type: string
        parent:
          type: string
          format: uuid
    common.ResponseStatusException:
      type: object
      required:
      - timestamp
      - status
      - error
      - path
      - requestId
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        requestId:
          type: string
    locations.PostSensorLocationsRequest:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/locations.SensorCreateLocationRequest'
    common.Pagination:
      type: object
      required:
      - perPage
      - page
      - total
      - pages
      properties:
        perPage:
          type: integer
          example: 10
        page:
          type: integer
          description: The current page number. The first page is 1
          minimum: 1
          example: 2
        total:
          type: integer
          example: 45
        pages:
          type: integer
          example: 5
    locations.AgentLocationRequest:
      type: object
      properties:
        name:
          type: string
        parent:
          type: string
          format: uuid
    locations.GetAgentLocationsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/locations.AgentLocationResponse'
        pagination:
          $ref: '#/components/schemas/common.Pagination'
    locations.PutSensorLocationsRequest:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/locations.SensorUpdateLocationRequest'
    locations.SensorUpdateLocationRequest:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: string
        locationType:
          type: string
          enum:
          - UNDEFINED
          - REGION
          - COUNTRY
          - STATE
          - CITY
          - DISTRICT
          - BUILDING
        timeZone:
          description: A java.util.TimeZone id, "INHERIT" to inherit from the parent location, or omit to leave unchanged. "INHERIT" only resolves to a real ancestor's timezone if this location has a parent Location (was created with parentLocationId) - a top-level location under an Organization has no parent Location to inherit from, so it falls back to the Carat server's own default timezone instead
          example: America/New_York
          oneOf:
          - $ref: '#/components/schemas/locations.TimeZoneId'
          - type: string
            enum:
            - INHERIT
        countryCode:
          $ref: '#/components/schemas/locations.CountryCodeName'
    locations.SensorLocation:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: string
        parentId:
          type: number
          description: The parent Location's id - null if this is a top-level location under an Organization rather than a sub-location of another Location
        parentOrganizationId:
          type: number
          description: The parent Organization's id - always present, even for a sub-location of another Location (derived from that parent Location's own organization)
        countryCode:
          $ref: '#/components/schemas/locations.CountryCodeName'
        timeZone:
          $ref: '#/components/schemas/locations.TimeZoneId'
        inheritedTimeZone:
          $ref: '#/components/schemas/locations.TimeZoneId'
        timeZoneLocation:
          type: string
          example: hm1
          description: Name of the ancestor Location where the inherited timezone came from - only meaningful when timeZone is null
    locations.GetSensorLocationResponse:
      $ref: '#/components/schemas/locations.SensorLocation'
    locations.GetSensorLocationsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/locations.SensorLocation'
        pagination:
          $ref: '#/components/schemas/common.Pagination'
